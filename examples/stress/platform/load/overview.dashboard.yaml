# Reads of load/records through widgets, for loading the widget-data path: a stat and charts
# that work the whole table out, and a table that pages through rows sorted on a column with
# no index. Open it in several browsers, or ask the same widgets over the API.
schemaVersion: 3
body:
  title: Load overview
  description: Counts, totals and a sorted list over load/records
  refresh: 1
  widgets:
    - id: rows
      type: core/stat
      title: Rows
      at: { x: 0, y: 0, w: 3, h: 4 }
      data:
        value:
          source:
            visual:
              table: load/records
              measures: [{ fn: count, as: rows }]
    - id: total
      type: core/stat
      title: Total amount
      at: { x: 3, y: 0, w: 3, h: 4 }
      data:
        value:
          source:
            visual:
              table: load/records
              filters: [{ column: active, op: eq, value: true }]
              measures: [{ fn: sum, column: amount, as: total }]
    - id: by-category
      type: core/chart
      title: Amount by category
      at: { x: 6, y: 0, w: 6, h: 8 }
      data:
        rows:
          source:
            visual:
              table: load/records
              groupBy: [{ column: category }]
              measures: [{ fn: sum, column: amount, as: amount }]
              sort: [{ by: amount, descending: true }]
      config: { mark: bar }
    - id: by-month
      type: core/chart
      title: Rows by month
      at: { x: 0, y: 4, w: 6, h: 8 }
      data:
        rows:
          source:
            visual:
              table: load/records
              groupBy: [{ column: created_on, bucket: month }]
              measures: [{ fn: count, as: rows }]
              sort: [{ by: created_on_month }]
      config: { mark: line }
    - id: biggest
      type: core/table
      title: Biggest amounts
      at: { x: 0, y: 12, w: 12, h: 8 }
      data:
        rows:
          source:
            visual:
              table: load/records
              columns: [seq, title, category, region, amount, created_on]
              sort: [{ by: amount, descending: true }]
              limit: 100
