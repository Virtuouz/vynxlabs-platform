name: Release

# A tag `v1.2.3` releases that version: the packages are staged on npm under `latest`,
# and the image is pushed to Docker Hub. A push to main builds `1.2.3-next.<commit>`
# under `next`, so that what is about to be released can be tried.
#
# Nothing is published until the repository says it may: the variable RELEASE_ENABLED
# must be `true`. Until then every run builds, checks and rehearses the release, and stops
# there, and needs none of the secrets below.
#
# The job runs in the environment `release` (main and `v*` tags only), which holds:
#   - NPM_TOKEN, a granular token that can only stage. npm refuses a direct publish with
#     it. The job stages every package (`npm stage publish`), and nothing is installable
#     until the owner opens the Staged Packages tab of each package on npmjs.com, or
#     runs `npm stage approve`, and confirms with 2FA.
#   - DOCKERHUB_OIDC_CONNECTIONID, a Docker Hub connection for GitHub Actions, so the
#     image is pushed without a stored password.
# The GitHub release is written only once the packages are staged and the image is pushed.
#
# Staging a `next` build for every push to main would ask the owner to approve every
# merge, so those are off unless the variable PUBLISH_NEXT is `true`. The image of a push
# to main is still pushed as `next` when RELEASE_ENABLED is `true`.

on:
  push:
    tags: ["v*"]
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  screenshots:
    name: The documentation's pictures
    # Taken from an instance built from this commit, seeded with Fernhill, in light and
    # dark with the clock fixed (packages/docs/screenshots.mjs lists them). A picture of
    # the list that was not taken fails the run, and the release waits for it. They are
    # kept as an artifact and never committed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Postgres, an object store and Keycloak
        run: docker compose -f deploy/compose/compose.dev.yaml --profile sso up -d --wait
      # Apps written as code are served at the console's address, so the pictures of
      # Apps show an instance that serves them (a real one sets APPS_URL).
      - name: Build the image and run it beside them
        run: |
          docker build -t volvel/volvel:shots .
          docker run -d --name platform --network host \
            -e DATABASE_URL=postgres://platform:platform@localhost:54329/platform \
            -e PORT=8080 -e PUBLIC_URL=http://localhost:8080 \
            -e S3_ENDPOINT=http://localhost:8333 -e S3_BUCKET=platform \
            -e S3_ACCESS_KEY_ID=platform -e S3_SECRET_ACCESS_KEY=platform-dev-secret \
            -e AUTH_SECRET="$(openssl rand -hex 32)" -e MASTER_KEY="$(openssl rand -base64 32)" \
            -e BOOTSTRAP_ADMIN_EMAIL=admin@example.com -e BOOTSTRAP_ADMIN_PASSWORD=change-me-please \
            -e MANAGED_WORKERS=process -e MANAGED_WORKER_USER=same \
            -e EGRESS_ALLOW=127.0.0.0/8,::1,localhost \
            -e APPS_ON_CONSOLE_ADDRESS=true \
            volvel/volvel:shots
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8080/api/v1/readyz > /dev/null && exit 0
            sleep 1
          done
          docker logs platform
          exit 1
      - run: pnpm exec tsc -b
      - name: Seed Fernhill
        run: |
          node examples/fernhill/stand-ins/server.mjs > /tmp/stand-ins.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4020/ > /dev/null && break
            sleep 1
          done
          cd examples/fernhill
          XDG_CONFIG_HOME="$RUNNER_TEMP/xdg" VOLVEL_URL=http://localhost:8080 node setup/setup.mjs
      - name: Take the pictures
        run: pnpm docs:screenshots
        env:
          # The scene of Database locations makes a second database beside the instance's own.
          DATABASE_URL: postgres://platform:platform@localhost:54329/platform
      - uses: actions/upload-artifact@v7
        with:
          name: docs-screenshots
          path: packages/docs/assets/screenshots
          if-no-files-found: error
          retention-days: 30
      - name: Logs
        if: failure()
        run: docker logs platform

  release:
    name: Build, rehearse, publish
    needs: screenshots
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # the GitHub release of a tag
      id-token: write # the sign-in to Docker Hub
    services:
      # The API's page of reference is written by the app itself, which needs a database.
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile

      # The pictures the documentation shows, taken by the job above: the build ships them.
      - uses: actions/download-artifact@v8
        with:
          name: docs-screenshots
          path: packages/docs/assets/screenshots

      - name: The version this is
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            base=$(node -p "require('./packages/sdk/package.json').version")
            echo "version=${base}-next.${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
            echo "tag=next" >> "$GITHUB_OUTPUT"
          fi

      - name: Give every published package that version
        run: node scripts/release-version.mjs "${{ steps.version.outputs.version }}"

      # The reference is written from the code of this version, the API's page included.
      - run: pnpm docs:generate
      - run: pnpm build
      - run: pnpm docs:check
      - name: Rehearse the release
        run: node scripts/release-check.mjs

      # The documentation as a static site, for any host that serves files (packages/docs-site/EXPORT.md).
      # Served at DOCS_EXPORT_BASE (a repository variable, `/docs/` when it is not set), with whole
      # addresses in its sitemap when DOCS_URL is set. Kept as an artifact for the website to fetch.
      - name: Export the documentation as a static site
        env:
          DOCS_BASE: ${{ vars.DOCS_EXPORT_BASE || '/docs/' }}
          DOCS_ORIGIN: ${{ vars.DOCS_URL }}
        run: |
          origin=()
          if [ -n "${DOCS_ORIGIN}" ]; then origin=(--origin "${DOCS_ORIGIN}"); fi
          node packages/docs/export.mjs --out docs-export --base "${DOCS_BASE}" "${origin[@]}" \
            --date "$(date -u +%F)"
      - uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: docs-export
          if-no-files-found: error
          retention-days: 90

      # Staging needs npm 11.15 or later. Each package is packed by pnpm, which writes the
      # real versions in place of `workspace:` ones, and the tarball is what is staged.
      # The order is that of the dependencies. The dist tag cannot be changed once staged.
      - name: Stage the packages on npm
        if: vars.RELEASE_ENABLED == 'true' && (github.ref_type == 'tag' || vars.PUBLISH_NEXT == 'true')
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          npm install --global npm@^11.15.0
          npm --version
          packs="${RUNNER_TEMP}/packs"
          mkdir -p "${packs}"
          for package in widgets widget-frame markup docs-engine docs-site docs ui app sdk cli; do
            pnpm --filter "@volvel/${package}" pack --pack-destination "${packs}"
            npm stage publish "${packs}/volvel-${package}-${VERSION}.tgz" --access public --tag "${TAG}" --ignore-scripts
          done

      - name: Sign in to Docker Hub
        if: vars.RELEASE_ENABLED == 'true'
        uses: docker/login-action@v4 # 4.5.0 or later, for the OIDC connection
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
        with:
          username: volvel

      - name: Build the image, and push it when releasing
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ vars.RELEASE_ENABLED == 'true' }}
          tags: |
            volvel/volvel:${{ steps.version.outputs.version }}
            volvel/volvel:${{ steps.version.outputs.tag }}

      # The words the changesets gave this version (CHANGELOG.md), then every pull request it
      # holds, grouped by label as .github/release.yml says.
      - name: Write the GitHub release
        if: vars.RELEASE_ENABLED == 'true' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node scripts/version-packages.mjs notes "${VERSION}" > "${RUNNER_TEMP}/notes.md"
          gh release create "${GITHUB_REF_NAME}" --verify-tag --title "Volvel ${VERSION}" \
            --notes-file "${RUNNER_TEMP}/notes.md" --generate-notes

      # The website is another repository. It is told when there is a version to build
      # its documentation from, once it exists to be told: set DOCS_SITE_REPOSITORY to it. The
      # dispatch names the run and the artifact (`docs-site`, the export) to fetch the site from.
      - name: Tell the website
        if: vars.RELEASE_ENABLED == 'true' && vars.DOCS_SITE_REPOSITORY != ''
        env:
          GH_TOKEN: ${{ secrets.DOCS_SITE_TOKEN }}
        run: |
          gh api "repos/${{ vars.DOCS_SITE_REPOSITORY }}/dispatches" \
            -f event_type=volvel-docs \
            -f "client_payload[version]=${{ steps.version.outputs.version }}" \
            -f "client_payload[tag]=${{ steps.version.outputs.tag }}" \
            -f "client_payload[run]=${{ github.run_id }}" \
            -f "client_payload[artifact]=docs-site" \
            -f "client_payload[base]=${{ vars.DOCS_EXPORT_BASE || '/docs/' }}"
