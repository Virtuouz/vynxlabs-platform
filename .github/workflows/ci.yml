name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (Postgres ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported release and the newest.
        postgres: ["16", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm check:schemas
      - run: pnpm check:migrations
      - name: Shipped migrations are unchanged
        if: github.event_name == 'pull_request'
        run: node scripts/migrations-lock.mjs --base "origin/${{ github.base_ref }}"
      - run: pnpm check:licenses

  image:
    name: Image and single-host stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure the stack
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "OBJECTSTORE_SECRET=$(openssl rand -hex 24)"
            echo "AUTH_SECRET=$(openssl rand -hex 32)"
            echo "MASTER_KEY=$(openssl rand -base64 32)"
            echo "PUBLIC_URL=http://127.0.0.1:8080"
            echo "BOOTSTRAP_ADMIN_EMAIL=admin@example.com"
            echo "BOOTSTRAP_ADMIN_PASSWORD=$(openssl rand -hex 12)"
          } > deploy/compose/.env
      - name: Build the image and boot from clean
        run: docker compose -f deploy/compose/compose.yaml up -d --build --wait
      - name: The instance is ready and migrated
        run: |
          curl -fsS http://127.0.0.1:8080/api/v1/readyz
          test "$(curl -fsS http://127.0.0.1:8080/api/v1/instance | jq .migrationLevel)" -ge 1
      - name: The console is served, and the bootstrap admin can sign in
        run: |
          curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="app">'
          . deploy/compose/.env
          curl -fsS -H 'content-type: application/json' -H 'origin: http://127.0.0.1:8080' \
            -d "{\"email\":\"$BOOTSTRAP_ADMIN_EMAIL\",\"password\":\"$BOOTSTRAP_ADMIN_PASSWORD\"}" \
            http://127.0.0.1:8080/api/v1/auth/sign-in/email | jq -e .user.email
      - name: The pages for apps are served, and an app's address that does not exist says so
        run: |
          curl -fsS http://127.0.0.1:8080/_platform/portal.css | grep -q -- '--vx-canvas'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/apps/nobody/main/portal/)" = 404
      - name: A restart applies no migration twice
        run: |
          docker compose -f deploy/compose/compose.yaml restart control-plane
          docker compose -f deploy/compose/compose.yaml up -d --wait
          docker compose -f deploy/compose/compose.yaml logs control-plane | grep -c "database is up to date"
      - name: Logs
        if: failure()
        run: docker compose -f deploy/compose/compose.yaml logs

  browser:
    name: The exit criterion, in a browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Postgres, an object store and Keycloak
        run: docker compose -f deploy/compose/compose.dev.yaml --profile sso up -d --wait
      - name: Keycloak has its realm
        run: |
          for i in $(seq 1 90); do
            curl -fsS http://localhost:8180/realms/acme/.well-known/openid-configuration > /dev/null && exit 0
            sleep 2
          done
          exit 1
      - name: Build the image
        run: docker build -t vynxlabs-platform:e2e .
      - name: Run the image beside them
        # On the host's network, so that the instance, the browser and the test's own git
        # server all reach each other and Keycloak at localhost, as its realm expects.
        run: |
          docker run -d --name platform --network host \
            -e DATABASE_URL=postgres://platform:platform@localhost:54329/platform \
            -e PORT=8080 -e PUBLIC_URL=http://localhost:8080 \
            -e S3_ENDPOINT=http://localhost:8333 -e S3_BUCKET=platform \
            -e S3_ACCESS_KEY_ID=platform -e S3_SECRET_ACCESS_KEY=platform-dev-secret \
            -e AUTH_SECRET="$(openssl rand -hex 32)" -e MASTER_KEY="$(openssl rand -base64 32)" \
            -e BOOTSTRAP_ADMIN_EMAIL=admin@example.com -e BOOTSTRAP_ADMIN_PASSWORD=change-me-please \
            -e MANAGED_WORKERS=true \
            vynxlabs-platform:e2e
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8080/api/v1/readyz > /dev/null && exit 0
            sleep 1
          done
          docker logs platform
          exit 1
      - name: Walk the exit criterion
        run: pnpm e2e
      - name: Logs
        if: failure()
        run: |
          docker logs platform
          docker compose -f deploy/compose/compose.dev.yaml logs keycloak | tail -50
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: e2e/results
          retention-days: 7
