# The desk's pages: the queue, the loans out, and the shelf. No code: edit it
# here or in the console's builder, whichever is to hand. Checking out and in
# are actions on each row, and a device is added and changed in a form.
schemaVersion: 2
body:
  title: Device desk
  description: Requests to hand out, loans to take back, and the shelf.
  pages:
    - id: queue
      title: Queue
      widgets:
        # The filters whoever reads it sets: every widget bound to one follows it.
        - id: filters
          type: core/filter
          at: { x: 0, y: 0, w: 12, h: 2 }
          config:
            reset: true
            filters:
              - { name: q, label: Search the desk, type: search }
              - { name: kind, label: Kind, type: choice, from: { table: devices, column: kind } }
        - id: pending
          title: Waiting for a decision
          type: core/stat
          at: { x: 0, y: 2, w: 3, h: 3 }
          data:
            value:
              source:
                visual:
                  table: requests
                  filters: [{ column: status, op: eq, value: pending }]
                  measures: [{ fn: count, as: requests }]
              filters: [{ filter: kind, column: kind }]
        - id: ready
          title: Ready to collect
          type: core/stat
          at: { x: 3, y: 2, w: 3, h: 3 }
          data:
            value:
              source:
                visual:
                  table: requests
                  filters: [{ column: status, op: eq, value: ready }]
                  measures: [{ fn: count, as: requests }]
              filters: [{ filter: kind, column: kind }]
        - id: waitlisted
          title: Waitlisted
          type: core/stat
          at: { x: 6, y: 2, w: 3, h: 3 }
          data:
            value:
              source:
                visual:
                  table: requests
                  filters: [{ column: status, op: eq, value: waitlisted }]
                  measures: [{ fn: count, as: requests }]
              filters: [{ filter: kind, column: kind }]
        - id: overdue
          title: Overdue loans
          type: core/stat
          at: { x: 9, y: 2, w: 3, h: 3 }
          data:
            value:
              source:
                visual:
                  table: loans
                  filters:
                    - { column: status, op: eq, value: out }
                    - { column: overdue, op: eq, value: true }
                  measures: [{ fn: count, as: loans }]
              filters: [{ filter: kind, column: kind }]
          config: { goodWhen: down }
        - id: open
          title: Open requests
          type: core/table
          at: { x: 0, y: 5, w: 12, h: 9 }
          data:
            rows:
              source:
                visual:
                  table: requests
                  filters: [{ column: status, op: in, value: [pending, ready, waitlisted] }]
                  sort: [{ by: created_at }]
              filters:
                - { filter: q, columns: [number, device_tag, student_name, student_number] }
                - { filter: kind, column: kind }
          config:
            pageSize: 25
            columns:
              - { column: number }
              - { column: student_name, label: Student }
              - { column: student_number, label: Number }
              - { column: kind }
              - { column: status }
              - { column: device_tag, label: Device }
              - { column: location }
              - { column: needed_by, label: Needed by }
            rowActions:
              - id: check-out
                label: Check out
                action:
                  when:
                    - { field: status, of: event, test: is, value: ready }
                  confirm:
                    title: Hand the device over?
                    text: "{student_name} is collecting {device_tag} for {number}."
                    button: Check out
                  steps:
                    - do: script
                      path: loans/check-out
                      input:
                        request: { record: number, of: event }
                    - { do: message, text: Checked out, tone: success }
        - id: out
          title: On loan
          type: core/table
          at: { x: 0, y: 14, w: 12, h: 9 }
          data:
            rows:
              source:
                visual:
                  table: loans
                  filters: [{ column: status, op: eq, value: out }]
                  sort: [{ by: due_on }]
              filters:
                - { filter: q, columns: [number, device_tag, student_name, student_number] }
                - { filter: kind, column: kind }
          config:
            pageSize: 25
            columns:
              - { column: number }
              - { column: device_tag, label: Device }
              - { column: kind }
              - { column: student_name, label: Student }
              - { column: due_on, label: Due }
              - { column: overdue }
            rowActions:
              - id: check-in
                label: Check in
                action:
                  confirm:
                    title: Take the device back?
                    text: "{student_name} is returning {device_tag}."
                    button: Check in
                    ask:
                      - {
                          name: condition,
                          label: Condition,
                          type: choice,
                          required: true,
                          choices: [good, worn, damaged],
                        }
                      - { name: note, label: Note, type: text }
                  steps:
                    - do: script
                      path: loans/check-in
                      input:
                        asset_tag: { record: device_tag, of: event }
                        condition: { asked: condition }
                        note: { asked: note }
                    - { do: message, text: Checked in, tone: success }
    - id: shelf
      title: Shelf
      widgets:
        # The filters whoever reads it sets: every widget bound to one follows it.
        - id: filters
          type: core/filter
          at: { x: 0, y: 0, w: 12, h: 2 }
          config:
            reset: true
            filters:
              - { name: q, label: Search devices, type: search }
              - { name: kind, label: Kind, type: choice, from: { table: devices, column: kind } }
              - {
                  name: location,
                  label: Location,
                  type: choice,
                  from: { table: devices, column: location },
                }
        - id: by-kind
          title: Devices by kind and state
          type: core/chart
          at: { x: 0, y: 2, w: 12, h: 8 }
          data:
            rows:
              source:
                visual:
                  table: devices
                  groupBy: [{ column: kind }, { column: status }]
                  measures: [{ fn: count, as: devices }]
              filters:
                - { filter: kind, column: kind }
                - { filter: location, column: location }
          config: { mark: bar, bars: stacked }
        - id: devices
          title: Devices
          type: core/table
          at: { x: 0, y: 10, w: 12, h: 12 }
          data:
            rows:
              source:
                visual:
                  table: devices
                  sort: [{ by: asset_tag }]
              filters:
                - { filter: q, columns: [asset_tag, model, serial, reserved_for] }
                - { filter: kind, column: kind }
                - { filter: location, column: location }
          config:
            pageSize: 50
            columns:
              - { column: asset_tag, label: Tag }
              - { column: kind }
              - { column: model }
              - { column: location }
              - { column: status }
              - { column: condition }
              - { column: reserved_for, label: Set aside for }
              - { column: notes }
            rowActions:
              - id: edit
                label: Edit
                action:
                  steps:
                    - { do: open, page: edit-device, record: event }
        - id: add
          type: core/button
          at: { x: 9, y: 22, w: 3, h: 1 }
          config: { label: Add device, tone: primary }
          on:
            click:
              steps:
                - { do: open, page: add-device }
    - id: edit-device
      title: Edit device
      kind: modal
      record: { table: devices }
      widgets:
        - id: form
          type: core/form
          at: { x: 0, y: 0, w: 12, h: 12 }
          data:
            record:
              source: { record: this }
          config:
            mode: edit
            fields:
              - { column: kind }
              - { column: model }
              - { column: location }
              - { column: status }
              - { column: condition }
              - { column: reserved_for, label: Set aside for }
              - { column: notes }
            submitLabel: Save
            submit:
              steps:
                - do: update
                  record: this
                  set:
                    kind: { asked: kind }
                    model: { asked: model }
                    location: { asked: location }
                    status: { asked: status }
                    condition: { asked: condition }
                    reserved_for: { asked: reserved_for }
                    notes: { asked: notes }
                - { do: close }
                - { do: message, text: Device saved, tone: success }
    - id: add-device
      title: Add device
      kind: modal
      widgets:
        - id: form
          type: core/form
          at: { x: 0, y: 0, w: 12, h: 14 }
          data:
            record:
              source: { visual: { table: devices } }
          config:
            mode: create
            fields:
              - { column: asset_tag, label: Tag }
              - { column: kind }
              - { column: model }
              - { column: serial }
              - { column: location }
              - { column: status }
              - { column: condition }
              - { column: notes }
            submitLabel: Add device
            submit:
              steps:
                - do: create
                  table: devices
                  set:
                    asset_tag: { asked: asset_tag }
                    kind: { asked: kind }
                    model: { asked: model }
                    serial: { asked: serial }
                    location: { asked: location }
                    status: { asked: status }
                    condition: { asked: condition }
                    notes: { asked: notes }
                - { do: close }
                - { do: message, text: Device added, tone: success }
