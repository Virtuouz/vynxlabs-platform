# A worker by itself, for running a tenant's scripts somewhere other than the
# instance: inside a client's network, next to the systems it has to reach.
#
#   cp .env.example .env    # then fill it in
#   docker compose up -d
#
# The worker makes outbound connections only, to the instance's address over
# HTTPS. Nothing needs to reach it, so it publishes no port.
name: volvel-worker

services:
  worker:
    image: ${VOLVEL_IMAGE:?set VOLVEL_IMAGE in .env}
    restart: unless-stopped
    # The worker ships inside the platform image.
    # The credential is read from a secret file, not the environment: an environment is
    # shown by `docker inspect` and read by other processes of the same user.
    command:
      - node
      - node_modules/@volvel/worker/dist/bin.js
      - --token-file
      - /run/secrets/worker_token
    environment:
      VOLVEL_URL: ${VOLVEL_URL:?set VOLVEL_URL in .env}
    secrets: [worker_token]
    # The worker keeps nothing: bundles are fetched again after a restart.
    read_only: true
    tmpfs:
      - /tmp

secrets:
  worker_token:
    file: ./worker-token
