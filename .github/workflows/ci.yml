name: CI

# Two speeds (CONTRIBUTING.md, "How CI runs").
#
# A pull request runs the fast lane: lint, types, the build, the checks of schemas, docs,
# migrations and licenses, the image, and only the unit tests that the change reaches (Vitest
# follows imports from what changed), on the newest Postgres.
#
# The full suite runs on every push to main, every night, on the release pull request, on a pull
# request that changes what everything rests on (dependencies, migrations, CI, build settings),
# and on any pull request labeled `full-ci` (add the label, then re-run). It is every unit test,
# in four shards, on the oldest supported Postgres and the newest, and every browser test.
#
# A change to docs, changesets or issue templates alone runs nothing but the summary.
#
# One check, "CI passed", sums the jobs up: it is the one the ruleset requires. On main and at
# night, a failure opens an issue (or adds to the open one).

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  scope:
    name: What this run needs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      mode: ${{ steps.decide.outputs.mode }}
      browser: ${{ steps.decide.outputs.browser }}
      unit: ${{ steps.decide.outputs.unit }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          mode=full
          reason="${EVENT}"
          e2e=false
          if [ "${EVENT}" = "pull_request" ]; then
            # Read now, not from the event: a label added before a re-run counts.
            labels=$(gh pr view "${PR}" --repo "${GITHUB_REPOSITORY}" --json labels --jq '[.labels[].name] | join(",")')
            files=$(git diff --name-only "origin/${BASE_REF}...HEAD")
            echo "Changed:"; echo "${files}" | sed 's/^/  /'
            if [[ ",${labels}," == *",full-ci,"* ]]; then
              reason="the full-ci label"
            elif [ "${HEAD_REF}" = "changeset-release/main" ]; then
              reason="the release pull request: what ships is tested in full"
            elif echo "${files}" | grep -q -E '^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|\.pnpmfile\.cjs|\.nvmrc|vitest\.config\.ts|tsconfig[^/]*\.json|biome\.json|\.github/workflows/ci\.yml|packages/db/migrations/|packages/[^/]+/package\.json|apps/[^/]+/package\.json)'; then
              reason="it changes what everything rests on"
            elif ! echo "${files}" | grep -q -v -E '^(docs/|\.changeset/|\.github/ISSUE_TEMPLATE/|\.github/[^/]+\.md$|\.github/CODEOWNERS$|\.github/dependabot\.yml$|\.github/release\.yml$|[^/]+\.md$|LICENSE$)'; then
              mode=none
              reason="docs, changesets and templates alone"
            else
              mode=fast
              reason="a pull request"
            fi
            echo "${files}" | grep -q '^e2e/' && e2e=true
          fi
          browser=false
          if [ "${mode}" = "full" ] || { [ "${mode}" = "fast" ] && [ "${e2e}" = "true" ]; }; then browser=true; fi
          if [ "${mode}" = "full" ]; then
            unit='{"postgres":["16","18"],"shard":["1","2","3","4"]}'
          else
            unit='{"postgres":["18"],"shard":["changed"]}'
          fi
          echo "mode=${mode}" >> "$GITHUB_OUTPUT"
          echo "browser=${browser}" >> "$GITHUB_OUTPUT"
          echo "unit=${unit}" >> "$GITHUB_OUTPUT"
          {
            echo "### CI: ${mode}"
            echo "Because of ${reason}. Browser tests: ${browser}."
          } >> "$GITHUB_STEP_SUMMARY"

  static:
    name: Lint, types, build and checks
    needs: scope
    if: needs.scope.outputs.mode != 'none'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      # What `pnpm check:schemas` does, without building a second time.
      - name: The schemas are up to date
        run: node packages/manifest/dist/emit-cli.js --check
      - run: pnpm docs:check
      - run: pnpm check:migrations
      - name: Shipped migrations are unchanged
        if: github.event_name == 'pull_request'
        run: node scripts/migrations-lock.mjs --base "origin/${{ github.base_ref }}"
      - run: pnpm check:licenses

  unit:
    name: Unit tests (Postgres ${{ matrix.postgres }}, ${{ matrix.shard == 'changed' && 'what the change reaches' || format('shard {0} of 4', matrix.shard) }})
    needs: scope
    if: needs.scope.outputs.mode != 'none'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.unit) }}
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Some tests run what the build makes (the CLI, the docs, the console's files).
      - run: pnpm build
      - name: The tests the change reaches
        if: matrix.shard == 'changed'
        run: pnpm exec vitest run --changed "origin/${{ github.base_ref }}" --passWithNoTests
      - name: One shard of every test
        if: matrix.shard != 'changed'
        run: pnpm exec vitest run --shard=${{ matrix.shard }}/4

  image:
    name: Image and single-host stack
    needs: scope
    if: needs.scope.outputs.mode != 'none'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure the stack
        run: |
          {
            # The bundled database and object store are in profiles, as .env.example has them.
            echo "COMPOSE_PROFILES=postgres,objectstore"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "OBJECTSTORE_SECRET=$(openssl rand -hex 24)"
            echo "AUTH_SECRET=$(openssl rand -hex 32)"
            echo "MASTER_KEY=$(openssl rand -base64 32)"
            echo "PUBLIC_URL=http://127.0.0.1:8080"
            echo "BOOTSTRAP_ADMIN_EMAIL=admin@example.com"
            echo "BOOTSTRAP_ADMIN_PASSWORD=$(openssl rand -hex 12)"
            echo "WORKER_HOST_TOKEN=$(openssl rand -hex 32)"
          } > deploy/compose/.env
      - name: Build the image and boot from clean
        run: docker compose -f deploy/compose/compose.yaml up -d --build --wait
      - name: The instance is ready and migrated
        run: |
          curl -fsS http://127.0.0.1:8080/api/v1/readyz
          test "$(curl -fsS http://127.0.0.1:8080/api/v1/instance | jq .migrationLevel)" -ge 1
      - name: The worker host is up, with its rules
        run: |
          docker compose -f deploy/compose/compose.yaml ps --status running worker-host | grep -q worker-host
          docker compose -f deploy/compose/compose.yaml logs worker-host | grep -q "worker host started"
      - name: The console is served, and the bootstrap admin can sign in
        run: |
          curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="app">'
          . deploy/compose/.env
          curl -fsS -H 'content-type: application/json' -H 'origin: http://127.0.0.1:8080' \
            -d "{\"email\":\"$BOOTSTRAP_ADMIN_EMAIL\",\"password\":\"$BOOTSTRAP_ADMIN_PASSWORD\"}" \
            http://127.0.0.1:8080/api/v1/auth/sign-in/email | jq -e .user.email
      - name: The pages for apps are served, and an app's address that does not exist says so
        run: |
          curl -fsS http://127.0.0.1:8080/_platform/portal.css | grep -q -- '--vx-canvas'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/apps/nobody/main/portal/)" = 404
      - name: A restart applies no migration twice
        run: |
          docker compose -f deploy/compose/compose.yaml restart control-plane
          docker compose -f deploy/compose/compose.yaml up -d --wait
          docker compose -f deploy/compose/compose.yaml logs control-plane | grep -c "database is up to date"
      - name: Logs
        if: failure()
        run: docker compose -f deploy/compose/compose.yaml logs

  e2e-image:
    name: The image the browser tests run
    needs: scope
    if: needs.scope.outputs.browser == 'true'
    # Built once and handed to each shard, so every shard runs the same image and the
    # build is paid for once rather than three times.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -t volvel/volvel:e2e .
      - name: Save it
        run: docker save volvel/volvel:e2e | gzip -1 > volvel-e2e.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: volvel-e2e-image
          path: volvel-e2e.tar.gz
          retention-days: 1

  browser:
    name: The exit criterion, in a browser (${{ matrix.group }})
    needs: [scope, e2e-image]
    if: needs.scope.outputs.browser == 'true'
    runs-on: ubuntu-latest
    strategy:
      # One shard failing does not stop the others: each says what it found.
      fail-fast: false
      matrix:
        # Three groups cut by how long their tests take (e2e/playwright.config.ts).
        group: [a, b, c]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Postgres, an object store and Keycloak
        run: docker compose -f deploy/compose/compose.dev.yaml --profile sso up -d --wait
      - name: Keycloak has its realm
        run: |
          for i in $(seq 1 90); do
            curl -fsS http://localhost:8180/realms/acme/.well-known/openid-configuration > /dev/null && exit 0
            sleep 2
          done
          exit 1
      - uses: actions/download-artifact@v8
        with:
          name: volvel-e2e-image
      - name: Load the image
        run: gunzip -c volvel-e2e.tar.gz | docker load
      - name: Run the image beside them
        # On the host's network, so that the instance, the browser and the test's own git
        # server all reach each other and Keycloak at localhost, as its realm expects. The
        # instance refuses loopback addresses for tenants unless allowed, and starts workers
        # beside itself only for code the operator writes unless told everyone is trusted:
        # both are what a developer's machine sets, as .env.example does.
        run: |
          mkdir -p /tmp/vx-mail && chmod 777 /tmp/vx-mail
          docker run -d --name platform --network host \
            -e DATABASE_URL=postgres://platform:platform@localhost:54329/platform \
            -e PORT=8080 -e PUBLIC_URL=http://localhost:8080 \
            -e S3_ENDPOINT=http://localhost:8333 -e S3_BUCKET=platform \
            -e S3_ACCESS_KEY_ID=platform -e S3_SECRET_ACCESS_KEY=platform-dev-secret \
            -e AUTH_SECRET="$(openssl rand -hex 32)" -e MASTER_KEY="$(openssl rand -base64 32)" \
            -e BOOTSTRAP_ADMIN_EMAIL=admin@example.com -e BOOTSTRAP_ADMIN_PASSWORD=change-me-please \
            -e MANAGED_WORKERS=process -e MANAGED_WORKER_USER=same \
            -e RUN_MEMORY_FLOOR_MB=512 \
            -e EGRESS_ALLOW=127.0.0.0/8,::1,localhost \
            -e MAIL_CAPTURE_DIR=/mail -v /tmp/vx-mail:/mail \
            volvel/volvel:e2e
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8080/api/v1/readyz > /dev/null && exit 0
            sleep 1
          done
          docker logs platform
          exit 1
      - name: Build the CLI that seeds Fernhill
        # Group c is the only one that walks Fernhill: a and b are the polish specs, which
        # make a tenant of their own.
        if: matrix.group == 'c'
        run: pnpm exec tsc -b
      - name: Seed Fernhill, the example the walk-throughs use
        if: matrix.group == 'c'
        # The phase walk-throughs sign in as Fernhill's people and use its data. Its outside
        # systems are stand-ins on 4020, which the instance reaches on the host's network.
        run: |
          node examples/fernhill/stand-ins/server.mjs > /tmp/stand-ins.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4020/ > /dev/null && break
            sleep 1
          done
          cd examples/fernhill
          XDG_CONFIG_HOME="$RUNNER_TEMP/xdg" VOLVEL_URL=http://localhost:8080 node setup/setup.mjs
      - name: Walk the exit criterion, one group of it
        # Approval mail is kept as files the test reads, as a developer's machine can.
        env:
          # Workers beside each other; each is an address of its own to the instance
          # (e2e/test.ts). A test that fails is run once more, and one that passes only then
          # is listed at the end of the run and in the job's summary (e2e/retry-report.ts).
          E2E_WORKERS: 4
          E2E_MAIL_DIR: /tmp/vx-mail
          # A source the data screens bind to: the stack's own Postgres.
          E2E_SOURCE_URL: postgres://platform:platform@localhost:54329/platform
        run: E2E_GROUP=${{ matrix.group }} pnpm e2e
      - name: Logs
        if: failure()
        run: |
          docker logs platform
          docker compose -f deploy/compose/compose.dev.yaml logs keycloak | tail -50
          cat /tmp/stand-ins.log || true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-test-results-${{ matrix.group }}
          path: e2e/results
          retention-days: 7

  passed:
    name: CI passed
    needs: [scope, static, unit, image, e2e-image, browser]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Every job that ran passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: ${RESULTS}"
          case " ${RESULTS} " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac
      - name: Say that main is failing
        if: failure() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WHAT: ${{ github.event_name == 'schedule' && 'The nightly run' || format('The run of {0}', github.sha) }}
        run: |
          title="main is failing"
          open=$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open --search "\"${title}\" in:title" --json number --jq '.[0].number // empty')
          body="${WHAT} failed: ${RUN}"
          if [ -n "${open}" ]; then
            gh issue comment "${open}" --repo "${GITHUB_REPOSITORY}" --body "${body}"
          else
            gh issue create --repo "${GITHUB_REPOSITORY}" --title "${title}" \
              --label "type: bug" --label "priority: p1" \
              --body "${body}. Close this once main passes again."
          fi
