# The desk's pages: the queue, the loans out, and the shelf. No code: edit it
# here or in the console's builder, whichever is to hand. Checking out and in
# are buttons, which pages have from phase 26.
schemaVersion: 2
body:
  title: Device desk
  description: Requests to hand out, loans to take back, and the shelf.
  pages:
    - id: queue
      title: Queue
      filters:
        - { name: kind, label: Kind, type: choice, from: { table: devices, column: kind } }
      widgets:
        - id: pending
          title: Waiting for a decision
          type: core/stat
          at: { x: 0, y: 0, w: 3, h: 3 }
          data:
            value:
              source:
                visual:
                  table: requests
                  filters: [{ column: status, op: eq, value: pending }]
                  measures: [{ fn: count, as: requests }]
              filters: [{ filter: kind, column: kind }]
        - id: ready
          title: Ready to collect
          type: core/stat
          at: { x: 3, y: 0, w: 3, h: 3 }
          data:
            value:
              source:
                visual:
                  table: requests
                  filters: [{ column: status, op: eq, value: ready }]
                  measures: [{ fn: count, as: requests }]
              filters: [{ filter: kind, column: kind }]
        - id: waitlisted
          title: Waitlisted
          type: core/stat
          at: { x: 6, y: 0, w: 3, h: 3 }
          data:
            value:
              source:
                visual:
                  table: requests
                  filters: [{ column: status, op: eq, value: waitlisted }]
                  measures: [{ fn: count, as: requests }]
              filters: [{ filter: kind, column: kind }]
        - id: overdue
          title: Overdue loans
          type: core/stat
          at: { x: 9, y: 0, w: 3, h: 3 }
          data:
            value:
              source:
                visual:
                  table: loans
                  filters:
                    - { column: status, op: eq, value: out }
                    - { column: overdue, op: eq, value: true }
                  measures: [{ fn: count, as: loans }]
              filters: [{ filter: kind, column: kind }]
          config: { goodWhen: down }
        - id: open
          title: Open requests
          type: core/table
          at: { x: 0, y: 3, w: 12, h: 9 }
          data:
            rows:
              source:
                visual:
                  table: requests
                  filters: [{ column: status, op: in, value: [pending, ready, waitlisted] }]
                  sort: [{ by: created_at }]
              filters: [{ filter: kind, column: kind }]
          config:
            pageSize: 25
            columns:
              - { column: number }
              - { column: student_name, label: Student }
              - { column: student_number, label: Number }
              - { column: kind }
              - { column: status }
              - { column: device_tag, label: Device }
              - { column: location }
              - { column: needed_by, label: Needed by }
        - id: out
          title: On loan
          type: core/table
          at: { x: 0, y: 12, w: 12, h: 9 }
          data:
            rows:
              source:
                visual:
                  table: loans
                  filters: [{ column: status, op: eq, value: out }]
                  sort: [{ by: due_on }]
              filters: [{ filter: kind, column: kind }]
          config:
            pageSize: 25
            columns:
              - { column: number }
              - { column: device_tag, label: Device }
              - { column: kind }
              - { column: student_name, label: Student }
              - { column: due_on, label: Due }
              - { column: overdue }
    - id: shelf
      title: Shelf
      filters:
        - { name: kind, label: Kind, type: choice, from: { table: devices, column: kind } }
        - {
            name: location,
            label: Location,
            type: choice,
            from: { table: devices, column: location },
          }
      widgets:
        - id: by-kind
          title: Devices by kind and state
          type: core/chart
          at: { x: 0, y: 0, w: 12, h: 8 }
          data:
            rows:
              source:
                visual:
                  table: devices
                  groupBy: [{ column: kind }, { column: status }]
                  measures: [{ fn: count, as: devices }]
              filters:
                - { filter: kind, column: kind }
                - { filter: location, column: location }
          config: { mark: bar, bars: stacked }
        - id: devices
          title: Devices
          type: core/table
          at: { x: 0, y: 8, w: 12, h: 12 }
          data:
            rows:
              source:
                visual:
                  table: devices
                  sort: [{ by: asset_tag }]
              filters:
                - { filter: kind, column: kind }
                - { filter: location, column: location }
          config:
            pageSize: 50
            columns:
              - { column: asset_tag, label: Tag }
              - { column: kind }
              - { column: model }
              - { column: location }
              - { column: status }
              - { column: condition }
              - { column: reserved_for, label: Set aside for }
              - { column: notes }
