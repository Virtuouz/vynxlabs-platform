# The whole platform on one machine: on-prem sites and single VPS installs.
#
#   cp deploy/compose/.env.example deploy/compose/.env    # then set the secrets
#   docker compose -f deploy/compose/compose.yaml up -d
#
# Set VOLVEL_IMAGE to run a published image instead of building from source.
#
# Two networks (decision 0001): `data` holds the database and the object store, and
# only the control plane joins it; `execution` holds the control plane and the worker
# host, which starts each tenant's managed workers. A tenant's script can reach the
# control plane and the internet, and never the database or the object store.
name: volvel

services:
  control-plane:
    image: ${VOLVEL_IMAGE:-volvel/volvel:local}
    build:
      context: ../..
    restart: unless-stopped
    # The bundled database and object store are in profiles, named by COMPOSE_PROFILES in `.env`.
    # Leave one out and give DATABASE_URL, or the S3 settings, of your own.
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      objectstore:
        condition: service_healthy
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://platform:${POSTGRES_PASSWORD:-}@postgres:5432/platform}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-}
      DATA_POOL_SIZE: ${DATA_POOL_SIZE:-}
      DATA_TENANT_CONNECTIONS: ${DATA_TENANT_CONNECTIONS:-}
      DATA_STATEMENT_TIMEOUT_MS: ${DATA_STATEMENT_TIMEOUT_MS:-}
      SQL_STATEMENT_TIMEOUT_MS: ${SQL_STATEMENT_TIMEOUT_MS:-}
      S3_ENDPOINT: ${S3_ENDPOINT-http://objectstore:8333}
      S3_REGION: ${S3_REGION:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-}
      S3_BUCKET: ${S3_BUCKET:-platform}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-platform}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-${OBJECTSTORE_SECRET:-}}
      PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL in .env}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      MASTER_KEY: ${MASTER_KEY:?set MASTER_KEY in .env}
      MASTER_KEY_SECONDARY: ${MASTER_KEY_SECONDARY:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      MANAGED_WORKERS: ${MANAGED_WORKERS:-host}
      WORKER_HOST_TOKEN: ${WORKER_HOST_TOKEN:?set WORKER_HOST_TOKEN in .env}
      EGRESS_ALLOW: ${EGRESS_ALLOW:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      APPS_URL: ${APPS_URL:-}
      APPS_ON_CONSOLE_ADDRESS: ${APPS_ON_CONSOLE_ADDRESS:-}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DOCS_URL: ${DOCS_URL:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      METRICS_WORKSPACE_LABELS: ${METRICS_WORKSPACE_LABELS:-}
      MANAGED_WORKER_USER: ${MANAGED_WORKER_USER:-}
      MANAGED_WORKER_UID: ${MANAGED_WORKER_UID:-10001}
      MANAGED_WORKER_GID: ${MANAGED_WORKER_GID:-10001}
      MANAGED_WORKER_USERS: ${MANAGED_WORKER_USERS:-256}
      MANAGED_WORKERS_MAX: ${MANAGED_WORKERS_MAX:-}
      RUN_SLOTS: ${RUN_SLOTS:-}
      RUN_MEMORY_FLOOR_MB: ${RUN_MEMORY_FLOOR_MB:-}
      SCHEDULE_BACKLOG_LIMIT: ${SCHEDULE_BACKLOG_LIMIT:-}
      EXPORTS_AT_ONCE: ${EXPORTS_AT_ONCE:-}
      EXPORTS_PER_TENANT: ${EXPORTS_PER_TENANT:-}
      EXPORT_STALL_SECONDS: ${EXPORT_STALL_SECONDS:-}
      EXPORT_MAX_MINUTES: ${EXPORT_MAX_MINUTES:-}
      TRIGGERS_PAUSED: ${TRIGGERS_PAUSED:-}
      RETENTION_RUNS_DAYS: ${RETENTION_RUNS_DAYS:-}
      RETENTION_EVENTS_DAYS: ${RETENTION_EVENTS_DAYS:-}
      RETENTION_REFUSALS_DAYS: ${RETENTION_REFUSALS_DAYS:-}
      RETENTION_AUDIT_DAYS: ${RETENTION_AUDIT_DAYS:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-}
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-}
      OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-}
      OTEL_METRIC_EXPORT_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL:-}
    networks: [data, execution]
    # A signal reaches the control plane itself, and finished child processes are collected.
    init: true
    # Docker's 10 seconds are not enough: stopping lets a managed worker of `process` mode finish
    # a script for up to 30 seconds, then ends it, then gives up 10 seconds later.
    stop_grace_period: 60s
    ports:
      - "${VOLVEL_BIND:-127.0.0.1:8080}:8080"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/api/v1/readyz').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # Starts managed workers, each as a user of its own, on the execution network only.
  worker-host:
    image: ${VOLVEL_IMAGE:-volvel/volvel:local}
    restart: unless-stopped
    depends_on:
      control-plane:
        condition: service_healthy
    command: ["volvel-worker-host"]
    # Root, to start each worker as a user of its own, holding only what that needs: SETUID and
    # SETGID to switch, CHOWN and DAC_OVERRIDE to make each worker's private directory and to
    # remove it, KILL to stop workers and scripts of other users, and NET_ADMIN for the rules that keep workers from private and metadata addresses.
    user: "0:0"
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, DAC_OVERRIDE, KILL, NET_ADMIN]
    # The host asks each worker to finish for up to 30 seconds, then ends it, then gives up after 10 more.
    stop_grace_period: 60s
    environment:
      VOLVEL_URL: http://control-plane:8080
      WORKER_HOST_TOKEN: ${WORKER_HOST_TOKEN:?set WORKER_HOST_TOKEN in .env}
      # What the host starts, and how many: sizes it as it is sized on its own machine.
      RUN_SLOTS: ${RUN_SLOTS:-}
      RUN_MEMORY_FLOOR_MB: ${RUN_MEMORY_FLOOR_MB:-}
      MANAGED_WORKERS_MAX: ${MANAGED_WORKERS_MAX:-}
      MANAGED_WORKER_UID: ${MANAGED_WORKER_UID:-10001}
      MANAGED_WORKER_GID: ${MANAGED_WORKER_GID:-10001}
      MANAGED_WORKER_USERS: ${MANAGED_WORKER_USERS:-256}
      # What a script may reach that is private: nothing, unless listed. Not EGRESS_ALLOW.
      WORKER_EGRESS_ALLOW: ${WORKER_EGRESS_ALLOW:-}
    networks: [execution]
    init: true
    # Healthy while the control plane answered the host's last request for work (it asks every
    # 20 seconds at most). A host that cannot reach it, or that was refused, is not.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const age = Date.now() - require('fs').statSync(require('os').tmpdir() + '/volvel-host-alive').mtimeMs; process.exit(age < 90000 ? 0 : 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  postgres:
    profiles: [postgres]
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: platform
    networks: [data]
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform"]
      interval: 5s
      timeout: 5s
      retries: 20

  objectstore:
    profiles: [objectstore]
    image: chrislusf/seaweedfs:4.53
    restart: unless-stopped
    # Telemetry off: the platform must never call home, and neither may its bundled services.
    command: server -s3 -dir=/data -ip.bind=0.0.0.0 -master.telemetry=false
    environment:
      AWS_ACCESS_KEY_ID: platform
      AWS_SECRET_ACCESS_KEY: ${OBJECTSTORE_SECRET:-}
    networks: [data]
    volumes:
      - objectstore:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20

networks:
  data:
  execution:

volumes:
  postgres:
  objectstore:
