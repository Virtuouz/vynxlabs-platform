# The students' pages: what they have asked for and what they have out. Asking
# for a device is a form and a button, which pages have from phase 26.
schemaVersion: 2
body:
  title: Borrow a device
  description: See what you have asked for and what you have out.
  pages:
    - id: mine
      title: My devices
      widgets:
        - id: intro
          type: core/text
          at: { x: 0, y: 0, w: 12, h: 2 }
          config:
            text: Ask the Tech Desk for a device and they will set one aside for you. Calculators and chargers are approved at once. Bring your student card when you collect it.
        - id: requests
          title: My requests
          type: core/table
          at: { x: 0, y: 2, w: 12, h: 7 }
          data:
            rows:
              source:
                visual:
                  table: requests
                  sort: [{ by: created_at, descending: true }]
          config:
            pageSize: 10
            columns:
              - { column: number }
              - { column: kind }
              - { column: status }
              - { column: device_tag, label: Device }
              - { column: location, label: Collect from }
              - { column: decision_note, label: Note }
        - id: loans
          title: On loan to me
          type: core/table
          at: { x: 0, y: 9, w: 12, h: 5 }
          data:
            rows:
              source:
                visual:
                  table: loans
                  filters: [{ column: status, op: eq, value: out }]
                  sort: [{ by: due_on }]
          config:
            pageSize: 10
            columns:
              - { column: device_tag, label: Device }
              - { column: kind }
              - { column: due_on, label: Due back }
              - { column: overdue }
        - id: free
          title: Free to borrow now
          type: core/chart
          at: { x: 0, y: 14, w: 12, h: 7 }
          data:
            rows:
              source:
                visual:
                  table: devices
                  filters: [{ column: status, op: eq, value: available }]
                  groupBy: [{ column: kind }]
                  measures: [{ fn: count, as: free }]
          config: { mark: bar }
