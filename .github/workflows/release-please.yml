name: Release PR

# Keeps a pull request open that turns what merged since the last release into
# the next version and its changelog, from the conventional titles of the
# squashed pull requests. Merging it tags `vX.Y.Z`, and the tag runs release.yml.
#
# A tag pushed with the workflow's own token starts no other workflow, so this
# uses RELEASE_PLEASE_TOKEN: a fine-grained token (or an app's) with contents and
# pull requests write on this repository. The same token lets CI run on the
# release pull request.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
