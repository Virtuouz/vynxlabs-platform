schemaVersion: 1
body:
  description: "Visits for each vet over a stretch of days: booked, finished, and the usual length."
  sql: |-
    select vet, count(*) as visits,
        count(*) filter (where status = 'done') as finished,
        round(avg(minutes)) as usual_minutes
      from appointments
      where vet is not null
        and ($1::date is null or starts_at::date >= $1::date)
        and ($2::date is null or starts_at::date <= $2::date)
      group by vet
      order by visits desc
  parameters:
    - name: from
      type: date
      label: From
    - name: to
      type: date
      label: To
