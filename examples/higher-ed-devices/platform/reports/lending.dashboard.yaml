# What the Tech Desk looks at each morning. Every widget asks a query of the
# workspace's tables, and whoever looks gets the loans the table's rules give
# them: the desk sees every loan, and a student would see their own.
# The date filter at the top narrows every widget bound to it.
#
# Each widget has a place on twelve columns: `at` is where it starts (x, y)
# and how big it is (w, h), in cells. A row is 40 pixels tall. In the console
# the same places are set by dragging, and by the arrow keys.
schemaVersion: 3
body:
  title: Lending
  description: Loans out, by month, status and kind
  # How often it asks again while it is on show, in minutes: off, 1, 5, 15 or 60.
  refresh: 15
  widgets:
    # The filters whoever reads it sets: every widget bound to one follows it.
    - id: filters
      type: core/filter
      at: { x: 0, y: 0, w: 12, h: 2 }
      config:
        reset: true
        filters:
          - name: lent
            label: Checked out
            type: date_range
            default: last_90_days
          - name: kind
            label: Kind
            type: choice
            from: { table: devices, column: kind }
    - id: lent
      type: core/stat
      title: Loans
      subtitle: Checked out in the range
      at: { x: 0, y: 2, w: 3, h: 4 }
      data:
        value:
          source:
            visual:
              table: loans
              measures: [{ fn: count, as: loans }]
          filters:
            - { filter: lent, column: checked_out_at }
            - { filter: kind, column: kind }
      # Compared with the same length of time before, with a line of how it
      # went and a caption in the desk's own words.
      config:
        compareTo: lent
        trendBy: checked_out_at
        caption: "vs {previous} in the period before"
    - id: out
      type: core/stat
      title: Still out
      at: { x: 3, y: 2, w: 3, h: 4 }
      data:
        value:
          source:
            visual:
              table: loans
              filters: [{ column: status, op: eq, value: out }]
              measures: [{ fn: count, as: loans }]
          filters:
            - { filter: kind, column: kind }
    - id: late
      type: core/stat
      title: Overdue
      subtitle: Still out past the day they were due
      at: { x: 6, y: 2, w: 3, h: 4 }
      data:
        value:
          source:
            visual:
              table: loans
              filters: [{ column: overdue, op: eq, value: true }]
              measures: [{ fn: count, as: loans }]
          filters:
            - { filter: lent, column: checked_out_at }
            - { filter: kind, column: kind }
      # More overdue loans is bad news, so the change is red when it goes up, and
      # it is said as a number of loans and not as a share.
      config:
        compareTo: lent
        delta: absolute
        goodWhen: down
        trendBy: checked_out_at
    - id: by-kind
      type: core/chart
      title: Loans by kind
      at: { x: 9, y: 2, w: 3, h: 9 }
      data:
        rows:
          source:
            visual:
              table: loans
              groupBy: [{ column: kind }]
              measures: [{ fn: count, as: loans }]
              sort: [{ by: loans, descending: true }]
          filters:
            - { filter: lent, column: checked_out_at }
      config: { mark: bar, horizontal: true }
    - id: weekly
      type: core/chart
      title: Checkouts, weekly
      subtitle: The dashed line is the period before
      at: { x: 0, y: 6, w: 9, h: 7 }
      data:
        rows:
          source:
            visual:
              table: loans
              groupBy: [{ column: checked_out_at, bucket: week }]
              measures: [{ fn: count, as: loans }]
              sort: [{ by: checked_out_at_week }]
          filters:
            - { filter: lent, column: checked_out_at }
            - { filter: kind, column: kind }
      config: { mark: line, compareTo: lent }
    - id: kind-status
      type: core/chart
      title: Kind by status
      subtitle: Darker is more loans
      at: { x: 9, y: 11, w: 3, h: 6 }
      data:
        rows:
          source:
            visual:
              table: loans
              groupBy: [{ column: status }, { column: kind }]
              measures: [{ fn: count, as: loans }]
          filters:
            - { filter: lent, column: checked_out_at }
      config: { mark: heatmap }
    - id: performance
      type: core/table
      title: By kind
      at: { x: 0, y: 13, w: 9, h: 6 }
      data:
        rows:
          source:
            visual:
              table: loans
              groupBy: [{ column: kind }]
              measures:
                - { fn: count, as: loans }
                - { fn: count_distinct, column: student_number, as: students }
              sort: [{ by: loans, descending: true }]
          filters:
            - { filter: lent, column: checked_out_at }
      config:
        columns:
          - { column: kind, label: Kind, as: badge }
          - { column: loans, label: Loans, as: bar }
          - { column: students, label: Students }
    - id: by-month
      type: core/pivot
      title: Loans by month and status
      at: { x: 0, y: 19, w: 12, h: 7 }
      data:
        rows:
          source:
            visual:
              table: loans
              groupBy:
                - { column: checked_out_at, bucket: month }
                - { column: status }
              measures: [{ fn: count, as: loans }]
          filters:
            - { filter: lent, column: checked_out_at }
            - { filter: kind, column: kind }
      config: { totals: true }
    - id: saved
      type: core/table
      title: By month and kind, from the saved query
      at: { x: 0, y: 26, w: 12, h: 7 }
      data:
        rows:
          source:
            query: reports/loans-by-month
          filters:
            - { filter: lent, parameter: since, part: from }
