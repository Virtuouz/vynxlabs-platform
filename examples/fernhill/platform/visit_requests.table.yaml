schemaVersion: 1
body:
  description: Visits a pet owner asked for in the portal's account pages, until the front desk books them.
  columns:
    client_code:
      type: text
      required: true
    pet_name:
      type: text
      required: true
    clinic:
      type: text
      required: true
    reason:
      type: text
      required: true
    preferred_on:
      type: date
    status:
      type: text
      required: true
      default: asked
  policy:
    type: rules
    rules:
      - allow: all
        when:
          column: clinic
          in: groups
      - allow: read
        when:
          column: client_code
          equals:
            attribute: client_id
  indexes:
    - - client_code
    - - clinic
