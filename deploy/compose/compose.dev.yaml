# Backing services for local development and tests. The control plane itself
# runs on the host with `pnpm dev`.
name: vynxlabs-platform-dev

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
      POSTGRES_DB: platform
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform"]
      interval: 2s
      timeout: 5s
      retries: 30

  objectstore:
    image: chrislusf/seaweedfs:4.53
    # Telemetry off: the platform must never call home, and neither may its bundled services.
    command: server -s3 -dir=/data -ip.bind=0.0.0.0 -master.telemetry=false
    environment:
      AWS_ACCESS_KEY_ID: platform
      AWS_SECRET_ACCESS_KEY: platform-dev-secret
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - objectstore:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz"]
      interval: 2s
      timeout: 5s
      retries: 30

  # An identity provider to try single sign-on against. Not started unless asked for:
  #   docker compose -f deploy/compose/compose.dev.yaml --profile sso up -d keycloak
  # The realm "acme" has two people, ada and ben, and an OIDC client. See
  # docs/self-hosting.md, "Single sign-on", for the SAML side.
  keycloak:
    profiles: ["sso"]
    image: quay.io/keycloak/keycloak:26.4
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro

volumes:
  postgres:
  objectstore:
