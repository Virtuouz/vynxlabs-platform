# Fly.io runs the same image as every other deployment mode.
# See deploy/fly/README.md for the one-time setup. Deploy from the repo root:
#
#   fly deploy . --config deploy/fly/fly.toml --dockerfile Dockerfile

app = "volvel"
primary_region = "iad"
# Room to swap, so that a machine short of memory slows down instead of stalling.
# Scripts are held to the machine's run slots and memory floor before it comes to that.
swap_size_mb = 512
# Seconds a stopping machine has to finish. The control plane lets workers finish a script for
# 30 seconds, ends them, and gives up 10 later; the worker host's machines need the same.
kill_timeout = 60

[env]
  PORT = "8080"
  # Fly's private network, where the workers reach the control plane (`<app>.internal`), is
  # IPv6 only. "::" answers on IPv6 and on IPv4.
  HOST = "::"
  LOG_LEVEL = "info"

[http_service]
  internal_port = 8080
  # The control plane's group. Named, so the `workers` group of the README has no service.
  processes = ["app"]
  force_https = true
  # The control plane will run the scheduler and queue, so it must not sleep.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/api/v1/readyz"
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"

# With MANAGED_WORKERS=process (the default) scripts run on this machine beside the
# control plane: 1 GB gives three run slots; each 160 MB more gives one more.
# RUN_SLOTS sets them outright. See /docs/self-host/explanation/running/sizing-and-scaling on an instance.
[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"
