# A flow over `count` items: it makes the list, then runs load/item once for each, ten at a
# time. A foreach runs at most 1,000 items; that is the default. Each item is a run of its
# own, so a per-minute schedule of this flow is a thousand runs a minute for as long as it
# lasts. The schedule skips a minute while the last flow run is still going.
schemaVersion: 1
body:
  description: Runs load/item for each of `count` items, 1,000 at most.
  nodes:
    start:
      type: trigger
      trigger:
        type: manual
        input:
          type: object
          properties:
            count:
              type: integer
              minimum: 1
              maximum: 1000
              default: 1000
          additionalProperties: false
    list:
      type: script
      script: load/items
      input: "{'count': has(trigger.count) ? trigger.count : 1000}"
    each:
      type: foreach
      items: steps.list.output.items
      script: load/item
      input: "{'index': item}"
      concurrency: 10
  edges:
    - { from: start, to: list }
    - { from: list, to: each }
